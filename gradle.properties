org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

kotlin.code.style=official

# The native engine is the slowest part of a clean build (5-15 min for
# llama.cpp). Set this to false to skip it: the app still builds and runs, and
# the chat screen reports the engine as unavailable rather than crashing.
tbchat.buildNativeEngine=true
